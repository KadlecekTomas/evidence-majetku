services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: evidence
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - evidence_postgres:/var/lib/postgresql/data

volumes:
  evidence_postgres:
